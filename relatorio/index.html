<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório — Luxon Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="relatorio.css">
</head>
<body>

<!-- ---------- PAINEL DE MONTAGEM (não sai no PDF) ---------- -->
<div class="montar" data-montar>
  <div class="montar__caixa">
    <h1 class="montar__titulo">Montar relatório</h1>
    <p class="montar__ajuda">
      Cole o Markdown que a IA devolveu. O relatório completo e o
      resumo executivo podem ir juntos — separe com uma linha
      contendo apenas <code>===</code>.
    </p>

    <div class="montar__linha">
      <label class="montar__campo">
        <span>Cliente</span>
        <input type="text" data-cliente value="Stadium Steakhouse" autocomplete="off">
      </label>
      <label class="montar__campo">
        <span>Unidade</span>
        <input type="text" data-unidade value="Barra" autocomplete="off">
      </label>
    </div>

    <div class="montar__linha">
      <label class="montar__campo">
        <span>Período</span>
        <input type="text" data-periodo value="1 a 30 de junho de 2026" autocomplete="off">
      </label>
      <label class="montar__campo montar__campo--curto">
        <span>Cor de destaque</span>
        <input type="color" data-cor value="#a8231f">
      </label>
    </div>

    <label class="montar__campo">
      <span>Markdown do relatório</span>
      <textarea data-fonte rows="12" spellcheck="false"
        placeholder="# Stadium Steakhouse · Barra · Junho de 2026&#10;&#10;## O essencial&#10;&#10;..."></textarea>
    </label>

    <div class="montar__acoes">
      <button type="button" class="montar__botao" data-gerar>Gerar</button>
      <button type="button" class="montar__botao montar__botao--forte" data-imprimir>Salvar em PDF</button>
      <button type="button" class="montar__botao montar__botao--fraco" data-exemplo>Carregar exemplo</button>
    </div>
  </div>
</div>

<!-- ---------- O DOCUMENTO ---------- -->
<article class="folha" data-folha hidden>

  <header class="capa">
    <div class="capa__topo">
      <span class="marca">Luxon<span class="marca__fim">Code</span></span>
      <span class="capa__tipo">Relatório de cardápio</span>
    </div>

    <div class="capa__meio">
      <p class="capa__rotulo">Preparado para</p>
      <h1 class="capa__cliente" data-capa-cliente></h1>
      <p class="capa__unidade" data-capa-unidade></p>
      <p class="capa__periodo" data-capa-periodo></p>
    </div>

    <div class="capa__pe">
      <p class="capa__emissao" data-capa-emissao></p>
      <p class="capa__nota">
        Análise de atenção no cardápio digital cruzada com o
        fechamento de vendas do período.
      </p>
    </div>
  </header>

  <section class="corpo" data-corpo></section>

</article>

<script src="relatorio.js"></script>
</body>
</html>
